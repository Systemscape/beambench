[package]
name = "beambench-rx"
version = "0.1.0"
edition = "2021"

[dependencies]
# ESP32-C3 bare-metal HAL
esp-hal = { version = "1.0.0", features = ["esp32c3", "unstable", "defmt"] }

# RTOS + Embassy async executor
esp-rtos = { version = "0.2.0", features = [
    "esp32c3",
    "embassy",
    "esp-radio",
    "defmt",
] }

# WiFi / ESP-NOW radio
esp-radio = { version = "0.17.0", default-features = false, features = [
    "esp32c3",
    "esp-now",
    "defmt",
    "esp-alloc",
    "unstable",
] }

# Heap allocator (required by esp-radio)
esp-alloc = "0.9.0"

# Panic handler
esp-backtrace = { version = "0.18.1", features = [
    "esp32c3",
    "panic-handler",
    "defmt",
] }

# Bootloader support
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32c3", "defmt"] }

# Async executor and utilities
embassy-executor = "0.9.1"
embassy-futures = "0.1"
embassy-sync = "0.7"
embassy-time = "0.5.0"
static_cell = "2"

# defmt logging
defmt = "1.0.1"
rtt-target = { version = "0.6.2", features = ["defmt"] }

# Shared protocol types
beambench-protocol = { path = "../protocol", features = ["defmt"] }
postcard = { version = "1", features = ["experimental-derive"] }
embedded-io = "0.7.1"
embedded-io-async = "0.7"
heapless = "0.9.2"

# SK6812 LED driver via RMT peripheral
esp-hal-smartled2 = "0.28.1"
smart-leds = "0.4.0"

critical-section = "1.2.0"

[profile.dev]
opt-level = "s"
debug = true

[profile.release]
codegen-units = 1
debug = false
lto = true
opt-level = 3
