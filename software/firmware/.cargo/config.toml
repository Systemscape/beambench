[build]
target = "riscv32imc-unknown-none-elf"
rustflags = [
  "-C", "link-arg=-Tdevice.x",
  "-C", "link-arg=-Tdefmt.x",
  "-C", "link-arg=-Tlinkall.x",
]

[unstable]
build-std = ["core", "alloc"]

[target.riscv32imc-unknown-none-elf]
runner = "probe-rs run --chip esp32c3 --always-print-stacktrace"

[env]
DEFMT_LOG = "info"
