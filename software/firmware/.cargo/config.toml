[build]
target = "riscv32imc-unknown-none-elf"
rustflags = [
  "-C", "link-arg=-Tdevice.x",
  "-C", "link-arg=-Tdefmt.x",
  "-C", "link-arg=-Tlinkall.x",
]

[target.riscv32imc-unknown-none-elf]
# Use our partition table; the IDF default puts the app over `otadata`.
# Relative path: run cargo from this directory.
runner = "probe-rs run --chip esp32c3 --always-print-stacktrace --idf-partition-table partitions.csv --idf-target-app-partition ota_0"

[env]
DEFMT_LOG = "info"
