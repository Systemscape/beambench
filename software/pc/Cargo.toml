[package]
name = "beambench-pc"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rx-sim"
path = "src/bin/rx-sim.rs"
required-features = ["sim"]

[features]
sim = []

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

# Serial communication
tokio-serial = "5.4"

# Shared protocol types
beambench-protocol = { path = "../protocol" }
postcard = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Embed frontend assets in release binary
rust-embed = { version = "8", features = ["axum"] }

# CLI
clap = { version = "4", features = ["derive"] }

# MIME type detection for static file serving
mime_guess = "2"

# Heapless strings (used by rx-sim for protocol Error messages)
heapless = "0.9.2"

# SHA-256 for OTA firmware verification
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
