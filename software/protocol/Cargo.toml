[package]
name = "beambench-protocol"
version = "0.1.0"
edition = "2021"

[features]
default = []
defmt = ["dep:defmt", "heapless/defmt"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
postcard = "1"
# heapless provides fixed-capacity String/Vec for no_std contexts
heapless = { version = "0.9.2", features = ["serde"] }
defmt = { version = "1.0.1", optional = true }
